name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install ruff

      - name: Ruff
        run: ruff check uipath_mcp_python/

      - name: Mypy (if configured)
        run: |
          if grep -q "\[tool.mypy\]" pyproject.toml 2>/dev/null || [ -f mypy.ini ]; then
            pip install mypy && mypy uipath_mcp_python/
          else
            echo "No mypy config — skipping."
          fi

      - name: Pytest (if tests exist)
        run: |
          if [ -d tests ] || ls test_*.py *_test.py >/dev/null 2>&1; then
            pip install pytest && pytest
          else
            echo "No tests yet — skipping."
          fi
